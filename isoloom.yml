# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP WebGoat (by the WebGoat team, OWASP) as an Isoloom spec: the upstream source, vendored
# unchanged in build/webgoat/app/, built into a jar by Maven and run by upstream's Dockerfile.
# One container serves WebGoat (8080) and its companion WebWolf (9090).
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: webgoat

# Given by the CyberCTF launcher: this player's flags for the WebGoat challenges (7 is main).
# Without them the development flags.
inputs:
  CTF_FLAG_MAIN: {}
  CTF_FLAG_ADMIN_LOST_PASSWORD: {}
  CTF_FLAG_WITHOUT_PASSWORD: {}
  CTF_FLAG_WITHOUT_ACCOUNT: {}

networks:
  lab: {cidr: 10.60.3.0/24, internet: false}

machines:
  webgoat:
    networks: {lab: 10}
    resources: {cpus: 2, memory_mb: 2048}
    ports:
      webgoat:
        port: 8080
        protocol: http
        publish: true
      webwolf:
        port: 9090
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
      - path: /run/lab/ctf_flag_admin_lost_password
        input: CTF_FLAG_ADMIN_LOST_PASSWORD
      - path: /run/lab/ctf_flag_without_password
        input: CTF_FLAG_WITHOUT_PASSWORD
      - path: /run/lab/ctf_flag_without_account
        input: CTF_FLAG_WITHOUT_ACCOUNT
    app:
      build: build/webgoat
checks:
  - name: WebGoat answers
    http: http://webgoat:8080/WebGoat/login
    wait: 240
  - name: WebGoat reports healthy
    http: http://webgoat:8080/WebGoat/actuator/health
  - name: WebWolf answers
    http: http://webgoat:9090/WebWolf/login
    wait: 120

message: |
  WebGoat answers at {{ machines.webgoat.ports.webgoat.url }}WebGoat and
  WebWolf at {{ machines.webgoat.ports.webwolf.url }}WebWolf. Register a user
  on the WebGoat login page (the same account logs in to WebWolf), then follow the lessons.
